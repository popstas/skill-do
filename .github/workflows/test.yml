name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check statusline-block.sh syntax
        run: bash -n skills/do/statusline-block.sh

      - name: Run tests
        run: python3 -m unittest discover skills/do/tests
